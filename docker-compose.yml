version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend-dev:
    build: ./backend/dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/dev/.env
    depends_on:
      - mongo

  backend-prod:
    build: ./backend/prod
    ports:
      - "3002:3002"
    env_file:
      - ./backend/prod/.env
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
      - backend-prod

volumes:
  mongo-data: